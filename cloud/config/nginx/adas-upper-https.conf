server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name adas.wmnnj.top;

    ssl_certificate /etc/letsencrypt/live/adas.wmnnj.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adas.wmnnj.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;

    include /etc/nginx/snippets/adas-media.conf;
    include /etc/nginx/snippets/adas-watch.conf;

    location = /api/ping {
        proxy_pass http://127.0.0.1:8000/api/ping;
        proxy_set_header Host $host;
    }
    location = /api/device/snapshot {
        proxy_pass http://127.0.0.1:8000/api/device/snapshot;
        proxy_set_header Host $host;
        proxy_set_header X-Device-Token $http_x_device_token;
    }
    location = /api/adas/snapshot {
        proxy_pass http://127.0.0.1:8000/api/adas/snapshot;
        proxy_set_header Host $host;
        proxy_set_header X-Viewer-Token $http_x_viewer_token;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
